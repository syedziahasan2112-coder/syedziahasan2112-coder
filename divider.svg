<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#ff2a6d"/>
      <stop offset="0.8" stop-color="#fcee0a"/>
      <stop offset="1" stop-color="#fcee0a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="24" fill="#07070d"/>
  <g filter="url(#glow)">
    <rect x="0" y="11" width="900" height="2" fill="url(#line)"/>
    <rect x="300" y="8" width="26" height="3" fill="#ff2a6d"/>
    <rect x="312" y="13" width="18" height="3" fill="#00f0ff"/>
    <rect x="618" y="9" width="20" height="3" fill="#00f0ff"/>
    <rect x="-80" y="9" width="80" height="6" fill="#ffffff" fill-opacity="0.9">
      <animate attributeName="x" values="-80;900" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
